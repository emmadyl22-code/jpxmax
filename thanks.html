<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 - X-max</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Helvetica', 'Hiragino Sans', 'Meiryo', sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background-color: #ffffff;
        }

        /* 导航栏 */
        nav {
            background-color: #ffffff;
            padding: 1rem 5%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .logo-x {
            color: #000000;
        }

        .logo-hyphen {
            width: 8px;
            height: 8px;
            background-color: #DC143C;
            display: inline-block;
        }

        .logo-max {
            color: #000000;
        }

        .logo-max .red-a {
            color: #DC143C;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #DC143C;
        }

        /* 感谢页面内容 */
        .thanks-section {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 5%;
            background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
        }

        .thanks-container {
            max-width: 700px;
            text-align: center;
            background-color: #ffffff;
            padding: 4rem 3rem;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .thanks-icon {
            font-size: 4rem;
            color: #DC143C;
            margin-bottom: 2rem;
        }

        .thanks-title {
            font-size: 2rem;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .thanks-subtitle {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .thanks-message {
            font-size: 1.1rem;
            color: #1a1a1a;
            margin-bottom: 3rem;
            line-height: 1.8;
        }

        .thanks-note {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: #DC143C;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .cta-button:hover {
            background-color: #B8122E;
            transform: translateY(-2px);
        }

        /* 页脚 */
        footer {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 2rem 5%;
        }

        .footer-logo {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .footer-logo .logo-x {
            color: #ffffff;
        }

        .footer-logo .logo-max {
            color: #ffffff;
        }

        .footer-logo .logo-max .red-a {
            color: #DC143C;
        }

        footer p {
            color: #cccccc;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .thanks-container {
                padding: 3rem 2rem;
            }

            .thanks-title {
                font-size: 1.6rem;
            }

            .thanks-subtitle {
                font-size: 1.1rem;
            }

            .thanks-message {
                font-size: 1rem;
            }

            .thanks-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <div class="logo">
                <span class="logo-x">X</span>
                <span class="logo-hyphen"></span>
                <span class="logo-max">m<span class="red-a">a</span>x</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">ホーム</a></li>
            </ul>
        </div>
    </nav>

    <!-- 感谢页面内容 -->
    <section class="thanks-section">
        <div class="thanks-container">
            <div class="thanks-icon">✓</div>
            <h1 class="thanks-title">送信が完了しました</h1>
            <p class="thanks-subtitle">お問い合わせありがとうございます。</p>
            <p class="thanks-message">内容を確認の上、担当者より折り返しご連絡させていただきます。</p>
            <p class="thanks-note">※自動返信メールが届かない場合は、迷惑メールフォルダをご確認ください。</p>
            <a href="index.html" class="cta-button">トップページへ戻る</a>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <div class="footer-logo">
            <span class="logo-x">X</span>
            <span class="logo-hyphen"></span>
            <span class="logo-max">m<span class="red-a">a</span>x</span>
        </div>
        <p>&copy; 2024 X-max. 全著作権所有。</p>
    </footer>
</body>
</html>
